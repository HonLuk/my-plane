name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build zipapp
      run: python build.py

    - name: Validate skill package
      run: |
        python -m compileall -q scripts
        python -m py_compile build.py
        test -f skills/SKILL.md
        test -f skills/references/work-item-description.md
        test -x skills/scripts/plane
        skills/scripts/plane --help

    - name: Package skill release
      run: |
        mkdir -p release
        cd skills
        zip -r ../release/my-plane-skill.zip SKILL.md references scripts/plane

    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.version.outputs.VERSION }}
        files: |
          release/my-plane-skill.zip
        body: |
          ## Plane CLI ${{ steps.version.outputs.VERSION }}

          Installable Agent Skill for managing Plane.so projects.

          ### Installation
          ```bash
          npx skills add https://github.com/HonLuk/my-plane/releases/download/${{ steps.version.outputs.VERSION }}/my-plane-skill.zip
          ```

          If the download fails because of a network error, retry with the
          GitHub proxy URL:
          ```bash
          npx skills add https://gh-proxy.com/https://github%2Ecom/HonLuk/my-plane/releases/download/${{ steps.version.outputs.VERSION }}/my-plane-skill.zip
          ```

          If Node.js is unavailable, download and extract the release package:
          ```bash
          mkdir -p skills
          curl -L -o /tmp/my-plane-skill.zip https://github.com/HonLuk/my-plane/releases/download/${{ steps.version.outputs.VERSION }}/my-plane-skill.zip
          unzip -o /tmp/my-plane-skill.zip -d skills
          chmod +x skills/scripts/plane
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
