name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all release assets
        run: make release

      - name: Validate native binary and skill archive
        run: |
          dist/plane-linux-amd64 --help
          test -f dist/plane-linux-amd64
          test -f dist/plane-linux-arm64
          test -f dist/plane-darwin-amd64
          test -f dist/plane-darwin-arm64
          test -f dist/plane-windows-amd64.exe
          test -f dist/my-plane-skill.zip
          test -f dist/SHA256SUMS
          ! unzip -Z1 dist/my-plane-skill.zip | grep -Eq '(^|/)scripts/plane(\.exe)?$'
          unzip -Z1 dist/my-plane-skill.zip | grep -Fx 'SKILL.md'
          unzip -Z1 dist/my-plane-skill.zip | grep -Fx 'references/work-item-description.md'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          files: |
            dist/plane-linux-amd64
            dist/plane-linux-arm64
            dist/plane-darwin-amd64
            dist/plane-darwin-arm64
            dist/plane-windows-amd64.exe
            dist/my-plane-skill.zip
            dist/SHA256SUMS
          body: |
            ## Plane CLI ${{ steps.version.outputs.VERSION }}

            This release contains native Go binaries for Linux, macOS, and Windows.

            ### Skill installation

            ```bash
            npx skills add https://github.com/HonLuk/my-plane/releases/download/${{ steps.version.outputs.VERSION }}/my-plane-skill.zip
            ```

            The skill archive contains instructions and references only. After installing it,
            follow `SKILL.md` to download the binary for the current platform into `scripts/plane`.

            If the direct download fails because of a network error, retry with the GitHub proxy URL:

            ```bash
            npx skills add https://gh-proxy.com/https://github%2Ecom/HonLuk/my-plane/releases/download/${{ steps.version.outputs.VERSION }}/my-plane-skill.zip
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
